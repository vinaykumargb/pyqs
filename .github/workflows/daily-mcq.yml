name: Daily MCQ Telegram Bot

on:
  schedule:
    # Runs at 23:30 UTC (5:00 AM IST) everyday
    - cron: '30 23 * * *'
  workflow_dispatch:  # Allows manual triggering for testing

jobs:
  post-mcqs:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl python-telegram-bot pytz requests
    
    - name: Run MCQ posting script
      env:
        TOKEN: ${{ secrets.TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python mock.py